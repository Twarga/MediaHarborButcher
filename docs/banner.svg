<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="MediaHarbor — Paste any link. Harvest everything.">
  <defs>
    <!-- Deep ink base with warm gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0d0e13"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>

    <!-- Amber glow, upper-left -->
    <radialGradient id="glow-amber" cx="18%" cy="15%" r="55%">
      <stop offset="0%"  stop-color="#ff8a3d" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>

    <!-- Coral glow, lower-right -->
    <radialGradient id="glow-coral" cx="86%" cy="85%" r="55%">
      <stop offset="0%"  stop-color="#ef4852" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#ef4852" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo mark gradient -->
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ef4852"/>
    </linearGradient>

    <!-- Display gradient for 'Harvest everything' -->
    <linearGradient id="grad-text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fff4e6"/>
      <stop offset="55%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ef4852"/>
    </linearGradient>

    <!-- Dot grid pattern -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f4f0e6" fill-opacity="0.04"/>
    </pattern>

    <!-- Soft shadow for mark -->
    <filter id="mark-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Backdrop layers -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <rect width="1200" height="400" fill="url(#glow-amber)"/>
  <rect width="1200" height="400" fill="url(#glow-coral)"/>

  <!-- Logo mark (anchor in rounded square) -->
  <g transform="translate(70, 120)" filter="url(#mark-shadow)">
    <rect width="56" height="56" rx="14" fill="url(#mark)"/>
    <g transform="translate(28, 28)" stroke="#0d0e13" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- anchor -->
      <circle cx="0" cy="-11" r="3.2"/>
      <line x1="0" y1="14" x2="0" y2="-7"/>
      <path d="M -7 3 H -11 a 10 10 0 0 0 22 0 H 7"/>
    </g>
  </g>

  <!-- Wordmark: "MediaHarbor" in Instrument Serif italic (with font fallback) -->
  <text x="150" y="165"
        font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="48" fill="#f4f0e6"
        letter-spacing="-0.015em">
    MediaHarbor
  </text>

  <!-- Tagline: small, mono, amber -->
  <text x="150" y="192"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="14" fill="#ff8a3d"
        letter-spacing="0.2em" text-transform="uppercase">
    v2.1 · PASTE ANY LINK
  </text>

  <!-- Headline (2 lines) -->
  <text x="70" y="280"
        font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
        font-size="84" fill="#f4f0e6"
        letter-spacing="-0.02em">
    Harvest
  </text>
  <text x="70" y="355"
        font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="84" fill="url(#grad-text)"
        letter-spacing="-0.02em">
    everything.
  </text>

  <!-- Right-side mini mockup preview -->
  <g transform="translate(720, 90)" opacity="0.96">
    <!-- window chrome -->
    <rect x="0" y="0" width="410" height="220" rx="14" fill="#13141a" stroke="#24262f"/>
    <rect x="0" y="0" width="410" height="28" rx="14" fill="#1a1c23"/>
    <rect x="0" y="14" width="410" height="14" fill="#1a1c23"/>
    <circle cx="14" cy="14" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="14" r="4" fill="#febc2e"/>
    <circle cx="46" cy="14" r="4" fill="#28c840"/>
    <rect x="80" y="6" width="250" height="16" rx="4" fill="#08090c"/>
    <text x="205" y="18" text-anchor="middle"
          font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="10" fill="#6e6a62">localhost:8000</text>

    <!-- URL input card -->
    <rect x="22" y="50" width="366" height="44" rx="10" fill="#13141a" stroke="#24262f"/>
    <text x="40" y="78"
          font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="13" fill="#9a958a">https://www.imgchest.com/p/7yzn…</text>
    <rect x="296" y="58" width="86" height="28" rx="8" fill="#ff8a3d"/>
    <text x="339" y="76" text-anchor="middle"
          font-family="'Inter', sans-serif" font-weight="600"
          font-size="12" fill="#08090c">Harvest</text>

    <!-- Stats row -->
    <g transform="translate(22, 112)">
      <rect width="116" height="60" rx="10" fill="#13141a" stroke="#24262f"/>
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="9" fill="#6e6a62" letter-spacing="0.05em">IMAGES</text>
      <text x="12" y="50" font-family="'Instrument Serif', serif" font-size="30" fill="#ffcb8a">47</text>

      <rect x="125" width="116" height="60" rx="10" fill="#13141a" stroke="#24262f"/>
      <text x="137" y="22" font-family="'Inter', sans-serif" font-size="9" fill="#6e6a62" letter-spacing="0.05em">VIDEOS</text>
      <text x="137" y="50" font-family="'Instrument Serif', serif" font-size="30" fill="#ff8a8e">8</text>

      <rect x="250" width="116" height="60" rx="10" fill="#13141a" stroke="#24262f"/>
      <text x="262" y="22" font-family="'Inter', sans-serif" font-size="9" fill="#6e6a62" letter-spacing="0.05em">STATUS</text>
      <circle cx="265" cy="44" r="3" fill="#14b8a6"/>
      <text x="275" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#14b8a6" font-weight="500">Complete</text>
    </g>

    <!-- Mini log lines -->
    <g transform="translate(22, 186)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10">
      <text y="0"  fill="#14b8a6">✓ image · screenshot-001.jpg</text>
      <text y="14" fill="#14b8a6">✓ image · screenshot-002.jpg</text>
    </g>
  </g>
</svg>
